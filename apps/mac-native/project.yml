name: HeyflareMac
options:
  bundleIdPrefix: com.doable.heyflare
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  HeyflareMac:
    type: application
    platform: macOS
    sources:
      # The layers shared with the iPhone app, compiled straight from its tree. Views are
      # not among them: a phone screen and a Mac window are different things.
      - path: ../ios-native/Sources/Core
        group: Shared
      - path: ../ios-native/Sources/Stores
        group: Shared
      - path: ../ios-native/Sources/Design
        group: Shared
        excludes:
          - "SwipeRow.swift"
          - "HorizontalPan.swift"
          - "FeedCard.swift"
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "heyflare.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doable.heyflare.mac
        PRODUCT_NAME: heyflare
        MARKETING_VERSION: "0.4.4"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/heyflare.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  HeyflareMac:
    build:
      targets:
        HeyflareMac: all
    run:
      config: Debug
    archive:
      config: Release
