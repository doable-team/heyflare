[package]
name = "heyflare-ios"
version = "0.1.0"
description = "heyflare for iPhone and iPad — a native shell for your heyflare mail server"
authors = ["Doable Team"]
license = "MIT"
edition = "2021"

[lib]
name = "heyflare_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
