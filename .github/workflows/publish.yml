# Publishes create-heyflare to npm when a GitHub release is published.
# Needs an NPM_TOKEN repository secret (npm → Access Tokens → Automation) — or switch to trusted publishing.
name: Publish create-heyflare
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: packages/create-heyflare
      # The template is generated from the repo and is not committed, so a checkout has none.
      # Without this the test scaffolds an empty project and fails on a missing package.json.
      - run: npm run sync-template
        working-directory: packages/create-heyflare
      - run: npm test
        working-directory: packages/create-heyflare
      - run: npm publish --provenance --access public
        working-directory: packages/create-heyflare
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
